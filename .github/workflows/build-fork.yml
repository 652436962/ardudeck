name: Build Linux packages (fork)

# Fork-friendly packaging workflow.
#
# Differences from the upstream `.github/workflows/build.yml`:
#   - Linux only. The upstream workflow also builds Windows x64 and macOS arm64,
#     which roughly triples CI time for a fork that only needs Linux artifacts.
#   - Runs on `workflow_dispatch` and on `v*` tags, so it is usable from a fork.
#   - Never publishes: artifacts only. The upstream workflow has
#     `permissions: contents: write` because it attaches assets to a release;
#     here `contents: read` is enough and strictly safer.
#   - Accepts an optional PAT for the engine download. See "Fetch orchestrator
#     engine" below for why the default GITHUB_TOKEN is not enough.
#
# Packaging toolchain note: `pnpm-lock.yaml` pins electron-builder@26.7.0, and a
# clean `pnpm install` therefore installs that version. This matters — 26.7.0
# accepts the `@ardudeckdesktop` executable name produced by the scoped package
# name (`@ardudeck/desktop`), which `apps/desktop/afterPack.cjs` wraps with
# `--no-sandbox`. Newer electron-builder releases reject that name as unsafe for
# file paths, so do not float this dependency without also fixing afterPack.cjs.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (e.g. v0.1.2). Also fills the artifact names and, with publish, the release to attach to. Leave empty to use package.json and skip publishing.'
        required: false
        type: string
      publish:
        description: 'Publish the built packages to the GitHub release named by release_tag.'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  # `contents: write` is required for the "Publish to release" step
  # (`gh release upload`, and `gh release create` when the tag is missing).
  # Without the publish input the job only uploads artifacts, so this is the
  # narrowest grant that keeps both paths working.
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NAME=ArduDeck-${VERSION}-linux" >> "$GITHUB_ENV"
          echo "Building version ${VERSION}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Native modules in this app need the udev/usb dev headers to build
      # (node-pty, serialport, usb).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Install dependencies
        run: pnpm install

      - name: Sync version into package manifests
        run: |
          node -e "
            const fs = require('fs');
            for (const p of ['./package.json', './apps/desktop/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      # `pnpm package` runs apps/desktop/scripts/stage-frame.mjs, which needs cargo
      # to compile crates/ardudeck-frame's `frame_blueprint` binary.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # On Linux `fetch-sim-engine.mjs` is a no-op, so the binary has to be built
      # and staged here or Resources/sim-engine ships empty.
      - name: Build and stage sim-engine
        run: |
          cargo build --release --manifest-path crates/ardudeck-sim-engine/Cargo.toml
          mkdir -p apps/desktop/sim-engine-bin
          cp crates/ardudeck-sim-engine/target/release/ardudeck-sim-engine apps/desktop/sim-engine-bin/ardudeck-sim-engine
          chmod +x apps/desktop/sim-engine-bin/ardudeck-sim-engine

      # mediamtx is gitignored, so without this Resources/bin ships empty and
      # every RTSP/SRT/RTP feed fails with "Video engine not installed".
      - name: Fetch mediamtx (linux x64)
        run: node tools/fetch-mediamtx.mjs linux x64

      - name: Build renderer/main bundles
        run: pnpm build

      # The pinned engine release (orchestrator-v0.1.1 on rubenCodeforges/ardudeck)
      # is a Draft invisible to this fork's tokens. Upstream's own `pnpm package`
      # chain bundles the engine into every published installer (see
      # apps/desktop/package.json), so we extract the same binary from upstream's
      # public Linux deb instead. Bump UPSTREAM_PKG_TAG when adopting a newer
      # upstream package; if upstream ever publishes the engine release, the
      # original `gh release download` path can be restored from git history.
      - name: Extract orchestrator engine from upstream public package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          UPSTREAM_PKG_TAG: v0.1.2-rc5
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          gh release download "$UPSTREAM_PKG_TAG" --repo rubenCodeforges/ardudeck \
            --pattern 'ArduDeck-*-linux-amd64.deb' --dir "$workdir"
          deb="$(ls "$workdir"/ArduDeck-*.deb | head -n1)"
          dpkg-deb -x "$deb" "$workdir/extracted"
          engine="$(find "$workdir/extracted" -type f -name 'ardudeck-orchestrator' | head -n1)"
          if [ -z "$engine" ]; then
            echo "::error title=Engine binary missing::ardudeck-orchestrator not found inside $deb"
            exit 1
          fi
          mkdir -p engine
          cp "$engine" engine/ardudeck-orchestrator
          chmod +x engine/ardudeck-orchestrator
          echo "Staged engine from $UPSTREAM_PKG_TAG:"
          sha256sum engine/ardudeck-orchestrator

      - name: Package Linux (AppImage + deb)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/stage-frame.mjs
          npx electron-builder --linux --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-AppImage
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-deb
          path: apps/desktop/release/*.deb
          if-no-files-found: warn

      # Publishing is opt-in: `publish: true` on a manual run, or any `v*` tag
      # push. `GH_TOKEN` is preferred for the upload so a fork can still publish
      # when the repo's own workflow permissions are restricted; `GITHUB_TOKEN`
      # is the fallback because it can write releases in its own repository.
      - name: Publish to release
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No packages were produced, nothing to publish."
            exit 1
          fi
          printf 'publishing: %s\n' "${files[@]}"
          # Create the release if this tag has none yet, then attach/overwrite.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "ArduDeck $TAG" \
              --notes "Linux packages built from ${{ github.sha }} by the Build Linux packages (fork) workflow."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
